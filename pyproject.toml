[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digestai"
version = "1.2.0"
description = "Model analysis toolkit"
authors = [
    { name = "Philip Colangelo" },
    { name = "Daniel Holanda" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyside6==6.8.3",
    "onnx>=1.17.0",
    "onnxruntime>=1.19.0",
    "pyqtgraph>=0.13.7",
    "huggingface_hub>=0.23.0",
    "pandas",
    "matplotlib",
    "networkx",
    "prettytable",
    "numpy",
    "platformdirs>=4.2.2",
    "pyyaml>=6.0.1",
    "psutil>=6.0.0",
    "torch",
    "transformers",
]

[project.scripts]
digest = "digest.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
digest = ["subgraph_analysis/database.zip"]

[tool.ruff]
line-length = 120
extend-exclude = [
    # Generated by src/digest/compile_digest_gui.py; do not edit by hand.
    "src/digest/ui",
    "src/digest/resource_rc.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused/undefined names, redefinitions
    "B",    # flake8-bugbear: mutable defaults, loop closures, ...
    "N",    # pep8-naming
    "BLE",  # broad `except Exception`
    "ARG",  # unused arguments
    "SLF",  # access to private members
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]
ignore = [
    "ARG005",   # Qt callbacks must accept arguments they do not use
    "B905",     # zip(strict=...) would change behavior
    "N802",     # Qt event overrides and slots use camelCase
    "N815",     # Qt signals are camelCase class attributes
    "N818",     # exception names need not end in "Error"
    "PLW2901",  # reassigning a loop variable is intentional here
]
