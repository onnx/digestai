# Copyright (c) ONNX Project Contributors
#
# SPDX-License-Identifier: Apache-2.0

# Licensing information for files that cannot carry a header, or that are
# generated and would lose one. Existing notices in files are kept;
# "aggregate" adds the information below to them. Check with `reuse lint`
# (https://reuse.software).

version = 1
SPDX-PackageName = "digestai"
SPDX-PackageDownloadLocation = "https://github.com/onnx/digestai"

# Project configuration and CI
[[annotations]]
path = [
    ".github/**",
    ".gitattributes",
    ".gitignore",
    ".pylintrc",
    "main.spec",
    "pixi.lock",
    "pixi.toml",
    "pyproject.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) ONNX Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

# Documentation and empty package markers
[[annotations]]
path = ["examples/README.md", "**/__init__.py"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) ONNX Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

# Generated by src/digest/compile_digest_gui.py (pyside6-uic, pyside6-rcc)
# from the Qt Designer .ui files and resource.qrc
[[annotations]]
path = [
    "src/digest/ui/**",
    "src/digest/resource.qrc",
    "src/digest/resource_rc.py",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) ONNX Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

# Application assets and data
[[annotations]]
path = [
    "src/digest/assets/**",
    "src/digest/styles/**",
    "src/digest/gui_config.yaml",
    "src/digest/subgraph_analysis/database.zip",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) ONNX Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

# Test model (exported with PyTorch 2.1.0) and its expected reports
[[annotations]]
path = ["test/resnet18.onnx", "test/resnet18_reports/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) ONNX Project Contributors"
SPDX-License-Identifier = "Apache-2.0"
