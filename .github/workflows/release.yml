name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and test (does not publish)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5043d30437de73e5e7500b5c41676e0c30aa54f2
        with:
          python-version: "3.12"
      - name: Verify release version
        run: |
          python -c "import os, tomllib; version=tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match pyproject.toml version'"
      - name: Build and check Python distributions
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python tools/check_wheel.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          pixi-version: v0.81.0
          environments: default
      - name: Build Windows executable
        run: pixi run build-exe
      - name: Smoke test executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          pixi run python -c "import subprocess;
          subprocess.run(['dist/digest.exe', '--smoke-test'], check=True, timeout=60)"
      - name: Package executable and license
        run: Compress-Archive -Path dist/digest.exe, LICENSE.txt -DestinationPath dist/digestai-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-executable
          path: dist/digestai-windows-x64.zip
          if-no-files-found: error

  release-assets:
    if: github.event_name == 'release'
    needs: [distributions, executable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-executable
          path: dist
      - name: Attach tested artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum ./*.whl ./*.tar.gz ./*.zip) > dist/SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" dist/* --clobber

  pypi:
    if: github.event_name == 'release' && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: [distributions, executable]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/digestai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-distributions
          path: dist
      - name: Publish tested distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
