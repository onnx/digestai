# Audit the GitHub Actions workflows and Dependabot config with zizmor.
# https://docs.zizmor.sh/

name: zizmor

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          # Report findings as PR annotations and fail the job,
          # instead of uploading SARIF to code scanning.
          advanced-security: false
          annotations: true
