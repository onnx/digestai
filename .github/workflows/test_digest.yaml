# Lint with ruff and run the tests in the pixi environments defined in pixi.toml.

name: Lint and test Digest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.81.0
          environments: lint
      - name: Lint with ruff
        run: pixi run -e lint lint --output-format=github

  test:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            environment: py311
          - os: ubuntu-latest
            environment: py312
          - os: ubuntu-latest
            environment: py313
          - os: windows-latest
            environment: py311
          - os: windows-latest
            environment: py312
          - os: windows-latest
            environment: py313
          - os: macos-15
            environment: py312
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux Qt runtime dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.81.0
          environments: ${{ matrix.environment }}
      - name: Run test suite with coverage
        run: pixi run -e ${{ matrix.environment }} test

  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5043d30437de73e5e7500b5c41676e0c30aa54f2
        with:
          python-version: "3.12"
      - name: Install Linux Qt runtime dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel outside checkout
        run: python tools/check_wheel.py dist
