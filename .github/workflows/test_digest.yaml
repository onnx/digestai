# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Lint and test Digest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  make-digest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Qt runtime dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Set up Miniconda with 64-bit Python
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: "latest"
          activate-environment: digestai
          python-version: ${{ matrix.python-version }}
      - name: Install Software Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pylint<4" pytest
          python -m pip check
      - name: Lint with PyLint
        run: |
          pylint src/utils
          pylint src/digest --disable E0401 --max-line-length=120
          pylint examples
          pylint test --disable E0401
      - name: Test summary reports
        run: |
          pytest test/test_reports.py test/test_huggingface.py
      # Please see contributing notes in the README 
      # to understand why this is commented and how to run it.
