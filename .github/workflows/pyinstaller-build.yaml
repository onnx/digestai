name: PyInstaller Build

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.81.0
          environments: default

      - name: Run PyInstaller
        run: pixi run build-exe

      - name: Verify executable creation
        run: dir dist\\digest.exe
        if: ${{ success() }}
        shell: cmd
