name: PyInstaller Build

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest 
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Miniconda with 64-bit Python
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniconda-version: "latest"
          activate-environment: digestai
          python-version: ${{ matrix.python-version }}
      - name: Install Software Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pylint pytest
          pip install pyinstaller
          python -m pip check

      - name: Run PyInstaller
        run: pyinstaller main.spec

      - name: Verify executable creation
        run: Get-Item dist/digest.exe
        shell: pwsh
