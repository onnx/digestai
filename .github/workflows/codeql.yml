# CodeQL code scanning for the Python sources and the GitHub Actions workflows.
# Results appear under Security > Code scanning and as checks on pull requests.

name: CodeQL

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read # read workflow run metadata for the analysis
      contents: read # check out the repository
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # security-and-quality includes the security-extended queries.
          queries: security-and-quality
          config: |
            paths-ignore:
              # Generated by src/digest/compile_digest_gui.py
              - src/digest/ui/**
              - src/digest/resource_rc.py

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
